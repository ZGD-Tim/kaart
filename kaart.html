<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geofencing tekenen – Drenthe</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #map {
      width: 100%;
      height: 65vh;
      min-height: 400px;
      background: #e0e0e0;
    }
    .controls {
      padding: 12px 16px;
      background: #f5f5f5;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #106ebe; }
    button.secondary { background: #666; }
    button.secondary:hover { background: #555; }
    #status { font-size: 14px; color: #333; }
    .result {
      padding: 12px 16px;
      flex: 1;
      overflow: auto;
    }
    textarea {
      width: 100%;
      height: 140px;
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      margin-top: 6px;
    }
    .tip {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="controls">
    <button onclick="copyGeoJSON()">Kopieer GeoJSON</button>
    <button class="secondary" onclick="clearAll()">Alles wissen</button>
    <span id="status">Teken een gebied in Drenthe</span>
  </div>

  <div class="result">
    <strong>GeoJSON resultaat:</strong>
    <div class="tip">Tip: kies het <strong>polygoon</strong>-icoon (links) en klik snel veel punten voor een vrije vorm. Dubbelklik om af te sluiten.</div>
    <textarea id="geojson" readonly placeholder="Nog niets getekend..."></textarea>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {

      // Start direct op Drenthe
      const map = L.map('map').setView([52.95, 6.60], 9);

      // Esri tiles
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 19
      }).addTo(map);

      // FeatureGroup
      const drawnItems = new L.FeatureGroup();
      map.addLayer(drawnItems);

      // Draw control
      const drawControl = new L.Control.Draw({
        edit: {
          featureGroup: drawnItems,
          remove: true
        },
        draw: {
          polygon: {
            allowIntersection: false,
            showArea: true,
            shapeOptions: {
              color: '#0078d4',
              weight: 3
            }
          },
          polyline: false,
          circle: true,
          rectangle: true,
          marker: false,
          circlemarker: false
        }
      });
      map.addControl(drawControl);

      // Events
      map.on(L.Draw.Event.CREATED, function (e) {
        drawnItems.addLayer(e.layer);
        updateGeoJSON();
      });

      map.on(L.Draw.Event.EDITED, updateGeoJSON);
      map.on(L.Draw.Event.DELETED, updateGeoJSON);

      function updateGeoJSON() {
        const geojson = drawnItems.toGeoJSON();
        document.getElementById('geojson').value = JSON.stringify(geojson, null, 2);

        const count = drawnItems.getLayers().length;
        document.getElementById('status').textContent =
          count === 0
            ? 'Nog niets getekend'
            : count + ' vorm(en) getekend – klaar om te kopiëren';
      }

      window.copyGeoJSON = function () {
        const text = document.getElementById('geojson').value;
        if (!text) {
          alert('Teken eerst een gebied.');
          return;
        }
        navigator.clipboard.writeText(text).then(function () {
          document.getElementById('status').textContent = 'GeoJSON gekopieerd naar klembord!';
        });
      };

      window.clearAll = function () {
        drawnItems.clearLayers();
        updateGeoJSON();
      };

      setTimeout(function () {
        map.invalidateSize();
      }, 200);
    });
  </script>
</body>
</html>
